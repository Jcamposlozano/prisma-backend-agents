[tool.poetry]
name = "westfield-agent-back-python"
version = "0.1.0"
description = "Backend Python (hexagonal-lite, FastAPI) del agente académico Maia de Westfield Business School. Port runtime-only del backend Node original."
authors = ["Westfield Engineering <eng@westfield.example>"]
readme = "README.md"
packages = [{ include = "westfield_agent_back_python", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.7.0"
httpx = "^0.27.0"
numpy = "^1.26.0"
pyyaml = "^6.0.1"
python-dotenv = "^1.0.0"
rich = "^13.7.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.23.7"
respx = "^0.21.1"
ruff = "^0.6.9"
black = "^24.8.0"
mypy = "^1.11.0"
pre-commit = "^3.8.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
