project:
  name: westfield-agent-back-python
  env: dev
  log_level: INFO

service:
  host: 0.0.0.0
  port: 8000
  # Orígenes permitidos por CORS. El front del proyecto Node corre en
  # localhost:5173 en dev. Agregar acá el dominio de producción cuando se
  # despliegue (Railway, etc.).
  cors_origins:
    - http://localhost:5173

worker:
  enabled: true
  interval_seconds: 10

# Bucket S3 con la estructura agents/<agent_id>/{config.json, prompts/, vector_store/}.
# Las credenciales AWS NO van acá: boto3 usa la cadena estándar
# (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / perfil / rol IAM).
s3:
  bucket: westfield-agent-knowledge
  region: us-east-1
  prefix: agents

# Caché en memoria de runtimes de agente (lazy load por agent_id).
registry:
  # Cuánto vive una entrada antes de recargar desde S3. Cambios en S3
  # (nueva versión de vector store, prompt) tardan hasta este TTL en verse.
  ttl_seconds: 300
  # Caché negativa: cuánto recordar que un agent_id NO existe (evita
  # martillar S3 con ids inventados).
  negative_ttl_seconds: 30

# Settings por proveedor LLM. Las API keys vienen SOLO de env vars
# (OPENAI_API_KEY, etc.) — nunca del YAML.
openai:
  base_url: https://api.openai.com/v1
  # Modelo de embeddings usado solo si el manifest.json del vector store
  # no declara `embedding_model` (no debería pasar con la ingesta nueva).
  embedding_model_fallback: text-embedding-3-small

rate_limit:
  # Ventana deslizante por IP+agente.
  window_seconds: 60
  max_requests: 12
